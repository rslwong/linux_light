# With persistence, /etc/passwd may come from an older image, in which case
# systemd-sysusers gives lightdm a new UID: hand its state directory to it.
d /var/lib/lightdm 0750 lightdm lightdm -
Z /var/lib/lightdm - lightdm lightdm -

# Persistence stores made with images before LightDM contain live-config's
# script that runs startx on tty1; with LightDM that would be a second session.
r /etc/profile.d/zz-live-config_xinit.sh
