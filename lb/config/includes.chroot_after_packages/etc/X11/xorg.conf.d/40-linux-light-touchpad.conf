# Touchpad defaults for Linux Light. Each user's changes made with
# linux-light-touchpad (Super+Shift+t) are applied on top of these at login.
#
# ThreeFingerDrag comes from Linux Light's patched xserver-xorg-input-libinput.
Section "InputClass"
	Identifier "Linux Light touchpad defaults"
	MatchIsTouchpad "on"
	MatchDevicePath "/dev/input/event*"
	Driver "libinput"
	Option "Tapping" "on"
	Option "TappingButtonMap" "lrm"
	Option "ThreeFingerDrag" "3"
	Option "DisableWhileTyping" "on"
EndSection
