# Packages removed from the installed system: the live-system machinery and
# the installer itself (shellprocess@linux-light then removes what only these
# needed).
---
backend: apt
operations:
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - live-tools
      - calamares
      - calamares-settings-debian
