# Partitioning for Linux Light (Debian ships no partition.conf, so Calamares
# would use its built-in defaults, which size swap for hibernation without
# offering a choice: 16+ GB of swap on a laptop with 16 GB of RAM).
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# "small" is RAM-sized swap capped at 8 GB and at 10% of the disk; "suspend"
# is enough to hibernate; "file" uses a swap file instead of a partition.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small

drawNestedPartitions:       false
alwaysShowPartitionLabels:  true
allowManualPartitioning:    true
initialPartitioningChoice:  none
defaultFileSystemType:      "ext4"
availableFileSystemTypes:   ["ext4", "btrfs"]
