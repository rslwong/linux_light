# As Debian's, but with GRUB in EFI/linux on the EFI system partition: the
# directory that Debian's GRUB updates reinstall to, since they take it from
# the first word of GRUB_DISTRIBUTOR ("Linux Light", from the branding).
#
# Calamares' own EFI fallback copy is off: it copies Debian's signed GRUB
# to EFI/BOOT/BOOTX64.EFI, which Secure Boot firmware refuses without shim.
# /usr/local/sbin/linux-light-finish-install sets up EFI/BOOT with shim.
---
efiBootLoader: "grub"
efiBootloaderId: "linux"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: false
