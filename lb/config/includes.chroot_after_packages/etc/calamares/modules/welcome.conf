# As Debian's, but Linux Light needs less disk space (about 4 GB installed).
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    10
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
