# Calamares settings for Linux Light, based on Debian's
# (calamares-settings-debian). Differences from Debian's sequence:
#  - shellprocess@linux-light: lifts the live system's kernel hold and
#    removes the installer itself from the installed system
#  - no sources-final: the installed system keeps Linux Light's apt sources
#    (main contrib non-free non-free-firmware) instead of Debian's defaults
#  - no plymouthcfg: Linux Light has no boot splash
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       linux-light
  module:   shellprocess
  config:   shellprocess-linux-light.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - shellprocess@linux-light
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - umount
- show:
  - finished

branding: linux-light
prompt-install: false
dont-chroot: false
