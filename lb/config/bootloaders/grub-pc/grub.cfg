source /boot/grub/config.cfg

# The default entry uses a "persistence" partition (or Ventoy persistence
# file) when one exists and silently runs without it otherwise.
menuentry "Linux Light" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Linux Light - without persistence (changes are discarded)" --hotkey=n {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nopersistence
	initrd	@INITRD_LIVE@
}

menuentry "Linux Light - safe graphics (fail-safe mode)" --hotkey=s {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@ findiso=${iso_path}
	initrd	@INITRD_LIVE@
}

menuentry "Linux Light - copy to RAM (without persistence)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram nopersistence
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
