# Linux Light settings.
#
# Read by ./build.sh and by the tools in tools/. Every value can also be
# overridden from the environment for a single run, e.g.
#
#   PERSISTENCE_SIZE=64G tools/make-usb.sh /dev/sdX
#   LIVE_KEYBOARD=de LIVE_TIMEZONE=Europe/Berlin ./build.sh

# --- Debian base ------------------------------------------------------------
DIST="${DIST:-trixie}"                                      # Debian release
MIRROR="${MIRROR:-http://deb.debian.org/debian/}"
SECURITY_MIRROR="${SECURITY_MIRROR:-http://security.debian.org/debian-security/}"

# --- Image ------------------------------------------------------------------
IMAGE_NAME="${IMAGE_NAME:-linux-light}"     # ISO is written to out/<name>-amd64.iso
ISO_VOLUME="${ISO_VOLUME:-LINUX_LIGHT}"     # ISO9660 volume label (max 32 chars)

# --- Live session defaults (applied at boot by live-config) -----------------
LIVE_HOSTNAME="${LIVE_HOSTNAME:-linux-light}"
LIVE_USERNAME="${LIVE_USERNAME:-user}"      # password is "live"; change it with passwd
LIVE_LOCALE="${LIVE_LOCALE:-en_US.UTF-8}"
LIVE_KEYBOARD="${LIVE_KEYBOARD:-us}"        # XKB layout(s), e.g. "us,de"
LIVE_TIMEZONE="${LIVE_TIMEZONE:-UTC}"       # e.g. "Asia/Hong_Kong"

# --- Persistence ------------------------------------------------------------
# Default size of the persistence partition (tools/make-usb.sh) or the
# Ventoy persistence file (tools/make-ventoy-persistence.sh).
# Accepts a number with a K/M/G/T suffix (32G, 8192M, ...). make-usb.sh also
# accepts "max" to use all remaining space on the stick.
PERSISTENCE_SIZE="${PERSISTENCE_SIZE:-32G}"
